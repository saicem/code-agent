services:
  # Tempo runs as user 10001, and docker compose creates the volume as root.
  # As such, we need to chown the volume in order for Tempo to start correctly.
  init:
    image: busybox:latest
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/var/tempo"
    volumes:
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:latest
    command: [ "--config.file=/mnt/config/loki.yml" ]
    volumes:
      - ./config/loki.yml:/mnt/config/loki.yml
    ports:
      - "3100:3100" # loki api
    networks:
      - observability

  tempo:
    image: grafana/tempo:2.10.5
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - ./config/tempo.yml:/etc/tempo.yml
      - tempo-data:/var/tempo
    ports:
      # - "4317:4317" # otlp grpc
      # - "4318:4318" # otlp http
      - "3200:3200" # tempo query
    networks:
      - observability
    depends_on:
      - init

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - observability

  # OpenTelemetry Collector - 使用外部配置文件（Windows 兼容）
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    command: [ "--config=/etc/otel-collector/config.yml" ]
    volumes:
      - ./config/otelcol.yml:/etc/otel-collector/config.yml
    ports:
      - "8888:8888" # Prometheus metrics exposed by the Collector
      - "8889:8889" # Prometheus exporter metrics
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP http receiver
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - observability

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:

networks:
  observability:
    driver: bridge
