name: code-agent
services:
  # Tempo runs as user 10001, and docker compose creates the volume as root.
  # As such, we need to chown the volume in order for Tempo to start correctly.
  init:
    image: busybox:latest
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/var/tempo"
    volumes:
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:latest
    command: [ "--config.file=/mnt/config/loki.yml" ]
    volumes:
      - ./config/loki.yml:/mnt/config/loki.yml
    networks:
      - observability
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=Host(`loki.docker.localhost`)"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"

  tempo:
    image: grafana/tempo:2.10.5
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - ./config/tempo.yml:/etc/tempo.yml
      - tempo-data:/var/tempo
    networks:
      - observability
      - traefik
    depends_on:
      - init
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tempo.rule=Host(`tempo.docker.localhost`)"
      - "traefik.http.services.tempo.loadbalancer.server.port=3200"

  prometheus:
    image: prom/prometheus:latest
    command: [ "--config.file=/prometheus.yml" ]
    volumes:
      - ./config/prometheus.yml:/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - observability
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.docker.localhost`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - observability
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.docker.localhost`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # OpenTelemetry Collector - 使用外部配置文件（Windows 兼容）
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    command: [ "--config=/etc/otel-collector/config.yml" ]
    volumes:
      - ./config/otelcol.yml:/etc/otel-collector/config.yml
    networks:
      - observability
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:

networks:
  observability:
    driver: bridge
  traefik:
    external: true
