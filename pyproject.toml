[project]
name = "code-agent"
version = "0.1.0"
description = "A simple code agent"
authors = [{ name = "saicem", email = "saicem@qq.com" }]
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.14.1",
    "openai>=2.33.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
    "opentelemetry-instrumentation-openai>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.62b1",
]

[tool.setuptools]
packages = ["code_agent"]
package-dir = { "" = "src" }

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.12", "ty>=0.0.32"]
