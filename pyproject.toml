[project]
name = "code-agent"
version = "0.1.0"
description = "A lightweight code agent for autonomous task execution."
authors = [{ name = "saicem", email = "saicem@qq.com" }]
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.14.2",
    "openai>=2.34.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
    "opentelemetry-instrumentation-openai>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.62b1",
    "pathspec>=1.1.1",
    "dependency-injector>=4.49.0",
]
scripts = { "apt" = "code_agent.main:main" }


[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["code_agent"]
package-dir = { "" = "src" }

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.12", "ty>=0.0.32"]

[tool.ruff]
target-version = "py313"
src = ["src"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM", "RUF", "TID"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["code_agent"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
