[project]
name = "code-agent"
version = "0.1.0"
description = "A simple code agent"
authors = [{ name = "saicem", email = "saicem@qq.com" }]
requires-python = ">=3.13"
dependencies = [
    "openai>=2.33.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "requests>=2.31.0",
]
scripts = { "dev" = "code_agent.main:main" }

[tool.setuptools]
packages = ["code_agent"]
package-dir = { "" = "src" }

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.12", "ty>=0.0.32"]
