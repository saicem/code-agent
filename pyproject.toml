[project]
name = "code-agent"
version = "0.1.0"
description = "A simple code agent"
authors = [
    { name = "saicem", email = "saicem@qq.com" },
]
requires-python = ">=3.11"
dependencies = [
    "dashscope>=1.25.16",
    "requests>=2.31.0",
    "llama-index>=0.10.0",
    "llama-index-embeddings-huggingface>=0.2.0",
    "llama-index-vector-stores-chroma>=0.2.0",
    "chromadb>=0.4.0",
]

[tool.setuptools]
packages = ["code_agent"]
package-dir = { ""= "src" }

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.15.10",
    "ty>=0.0.29",
]
